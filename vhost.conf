<VirtualHost *>
    #ServerAdmin @lsmod.de
    ServerName maintainer.opensuse.org
    ServerAlias maintainer.*
   Alias /favicon.ico /srv/www/htdocs/maintainerfavicon.ico
   <IfModule perl_module>
     PerlSetEnv SUSEPKGINFO_DB /var/lib/wwwrun/db/
     PerlSetEnv SUSEPKGINFO_FAVICON /srv/www/htdocs/maintainerfavicon.ico
   </IfModule>
   SetEnv SUSEPKGINFO_DB /var/lib/wwwrun/db/
   SetEnv SUSEPKGINFO_FAVICON /srv/www/htdocs/maintainerfavicon.ico
   ScriptAlias / /srv/www/cgi-bin/opensusemaintainer/
#   <Directory "/srv/www/cgi-bin"> # already via conf.d/mod_perl.conf
#      SetHandler perl-script
#      PerlResponseHandler ModPerl::Registry
#      PerlOptions +ParseHeaders
#      Options +ExecCGI
#      allow from all
#  </Directory>
#  CustomLog log/maintainer-access_log combined
</VirtualHost>
